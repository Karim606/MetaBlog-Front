<svg width="260" height="56" viewBox="0 0 260 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Metablog typing logo">
  <title>Metablog — typing animation</title>

  <style>
    text { font-family: 'Poppins', Arial, sans-serif; font-weight:600; font-size:30px; dominant-baseline:middle; fill:#000; }
    .stroke-blue { stroke:#1193d4; stroke-width:2.5; fill:none; }
    .fill-blue { fill:#1193d4; }
    .dot { fill:#fff; }
  </style>

  <!-- Metabl text -->
  <text x="0" y="30">Metabl</text>

  <!-- bubble (circle + tail) -->
  <g transform="translate(102,0)">
    <circle cx="20" cy="28" r="10" class="fill-blue" />
    <path d="M12 36 L8 42 L16 38 Z" class="fill-blue"/>
    <circle cx="20" cy="28" r="10" class="stroke-blue"/>

    <!-- animated dots -->
    <circle cx="16" cy="28" r="1.6" class="dot">
      <animate attributeName="cy" values="28;26;28" dur="1s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" begin="0s" repeatCount="indefinite" />

    </circle>
    <circle cx="20" cy="28" r="1.6" class="dot">
      <animate attributeName="cy" values="28;26;28" dur="1s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" begin="0s" repeatCount="indefinite" />

    </circle>
    <circle cx="24" cy="28" r="1.6" class="dot">
      <animate attributeName="cy" values="28;26;28" dur="1s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" begin="0s" repeatCount="indefinite" />

    </circle>
  </g>

  <!-- g after bubble -->
  <text x="138" y="30">g</text>
</svg>
